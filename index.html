<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halom Casa Calendar</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;}
header{background:#222;color:#fff;padding:12px;display:flex;justify-content:space-between;}

#loginBox,#calendarContainer{
  max-width:1100px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;
}

input,textarea,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box;}

#calendar{max-width:1000px;margin:auto;}

.modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
  align-items:center;justify-content:center;
}

.modal-content{
  background:#fff;padding:20px;border-radius:10px;width:90%;max-width:450px;
}
</style>
</head>

<body>

<header>
<h3>Halom Casa Calendar</h3>
<button id="logoutBtn" style="width:auto;display:none">Logout</button>
</header>

<div id="loginBox">
<h2>Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<div id="loginMsg"></div>
</div>

<div id="calendarContainer" style="display:none">
<div id="calendar"></div>
</div>

<div id="bookingModal" class="modal">
  <div class="modal-content">
    <h3>Block Date</h3>
    <input id="guestName" placeholder="Guest Name">
    <textarea id="notes" placeholder="Notes"></textarea>
    <button id="saveBooking">Save Booking</button>
    <button onclick="closeBooking()">Cancel</button>
  </div>
</div>

<div id="viewModal" class="modal">
  <div class="modal-content">
    <h3>Booking Details</h3>
    <p><b>Date:</b> <span id="vDate"></span></p>
    <p><b>Guest:</b> <span id="vGuest"></span></p>
    <p><b>Notes:</b> <span id="vNotes"></span></p>
    <button id="unblockBtn">Unblock Date</button>
    <button onclick="closeView()">Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLeIhKV7wHeeTtJhKuCSJuoJwfr8Lqn54",
  authDomain: "halom-casa-booking-calendar.firebaseapp.com",
  projectId: "halom-casa-booking-calendar",
  storageBucket: "halom-casa-booking-calendar.firebasestorage.app",
  messagingSenderId: "171254486073",
  appId: "1:171254486073:web:d1ea9a603c5b33d602a9e8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;
let selectedDate = null;
let selectedDoc = null;

function open(id){document.getElementById(id).style.display='flex';}
function close(id){document.getElementById(id).style.display='none';}

window.closeBooking = () => close('bookingModal');
window.closeView = () => close('viewModal');

document.getElementById('loginBtn').onclick = async () => {
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
  }catch(e){
    loginMsg.innerText = e.message;
  }
};

logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth,(user)=>{
  if(user){
    loginBox.style.display='none';
    calendarContainer.style.display='block';
    logoutBtn.style.display='block';
    initCalendar();
  }else{
    loginBox.style.display='block';
    calendarContainer.style.display='none';
    logoutBtn.style.display='none';
  }
});

function initCalendar(){
  calendar = new FullCalendar.Calendar(document.getElementById('calendar'),{
    initialView:'dayGridMonth',

    dateClick(info){
      selectedDate = info.dateStr;
      open('bookingModal');
    },

    eventClick(info){
      const e = info.event.extendedProps;
      selectedDoc = e.docId;

      vDate.innerText = info.event.startStr;
      vGuest.innerText = e.guestName;
      vNotes.innerText = e.notes || "No notes";

      open('viewModal');
    }
  });

  calendar.render();
  loadBookings();
}

function loadBookings(){
  const q = query(collection(db,'blockedDates'));

  onSnapshot(q,(snapshot)=>{

    calendar.removeAllEvents();

    snapshot.forEach(d=>{
      const data = d.data();

      calendar.addEvent({
        title: data.guestName || 'Blocked',
        start: data.date,
        color:'red',
        allDay:true,
        docId:d.id,
        guestName:data.guestName,
        notes:data.notes
      });
    });

  });
}

document.getElementById('saveBooking').onclick = async () => {

  let name = guestName.value;
  let note = notes.value;

  if(!name){
    alert("Enter guest name");
    return;
  }

  await addDoc(collection(db,'blockedDates'),{
    date:selectedDate,
    guestName:name,
    notes:note || ""
  });

  closeBooking();
};

unblockBtn.onclick = async () => {
  await deleteDoc(doc(db,'blockedDates',selectedDoc));
  closeView();
};

</script>

</body>
</html>
