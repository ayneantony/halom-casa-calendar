<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halom Casa Calendar</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#222;
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
}

#loginBox,#calendarContainer{
  max-width:1100px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
}

input,textarea,button{
  padding:10px;
  margin:5px 0;
  width:100%;
  box-sizing:border-box;
}

button{
  cursor:pointer;
}

#calendar{
  max-width:1000px;
  margin:auto;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:white;
  width:90%;
  max-width:450px;
  padding:20px;
  border-radius:10px;
}

/* calendar borders */
.fc-theme-standard td,
.fc-theme-standard th {
  border: 1.5px solid #444 !important;
}

.fc .fc-scrollgrid {
  border: 2px solid #222 !important;
}

.fc .fc-daygrid-day {
  border: 1px solid #555 !important;
}

.fc .fc-col-header-cell {
  background: #f0f0f0;
  font-weight: bold;
  border: 1.5px solid #333 !important;
}

/* 🔥 GREY BLOCKED STYLE */
.blocked-date {
  background: #dcdcdc !important;
  opacity: 0.6 !important;
  pointer-events: none !important;
}
</style>
</head>

<body>

<header>
<h3>Halom Casa Calendar</h3>
<button id="logoutBtn" style="width:auto;display:none">Logout</button>
</header>

<!-- LOGIN -->
<div id="loginBox">
<h2>Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<div id="loginMsg"></div>
</div>

<!-- CALENDAR -->
<div id="calendarContainer" style="display:none">
<div id="calendar"></div>
</div>

<!-- BOOKING MODAL -->
<div id="bookingModal" class="modal">
  <div class="modal-content">
    <h3>Block Date</h3>
    <input id="guestName" placeholder="Guest Name">
    <textarea id="notes" placeholder="Notes"></textarea>
    <button id="saveBooking">Save Booking</button>
    <button onclick="closeBooking()">Cancel</button>
  </div>
</div>

<!-- VIEW MODAL -->
<div id="viewModal" class="modal">
  <div class="modal-content">
    <h3>Booking Details</h3>
    <p><b>Date:</b> <span id="vDate"></span></p>
    <p><b>Guest:</b> <span id="vGuest"></span></p>
    <p><b>Notes:</b> <span id="vNotes"></span></p>
    <button id="unblockBtn">Unblock Date</button>
    <button onclick="closeView()">Close</button>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLeIhKV7wHeeTtJhKuCSJuoJwfr8Lqn54",
  authDomain: "halom-casa-booking-calendar.firebaseapp.com",
  projectId: "halom-casa-booking-calendar",
  storageBucket: "halom-casa-booking-calendar.firebasestorage.app",
  messagingSenderId: "171254486073",
  appId: "1:171254486073:web:d1ea9a603c5b33d602a9e8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;
let selectedDate = null;
let selectedDoc = null;
let bookedDates = [];

/* MODALS */
function openModal(id){
  document.getElementById(id).style.display='flex';
}
function closeModal(id){
  document.getElementById(id).style.display='none';
}

window.closeBooking = () => closeModal('bookingModal');
window.closeView = () => closeModal('viewModal');

/* LOGIN */
document.getElementById('loginBtn').onclick = async () => {
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
  }catch(e){
    loginMsg.innerText = e.message;
  }
};

logoutBtn.onclick = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth, async user=>{
  if(user){
    loginBox.style.display='none';
    calendarContainer.style.display='block';
    logoutBtn.style.display='block';
    initCalendar();
  }else{
    loginBox.style.display='block';
    calendarContainer.style.display='none';
    logoutBtn.style.display='none';
  }
});

/* CALENDAR */
function initCalendar(){
  calendar = new FullCalendar.Calendar(document.getElementById('calendar'),{

    initialView:'dayGridMonth',

    dateClick(info){

      const clicked = info.dateStr;

      if(bookedDates.includes(clicked)){
        alert("❌ This date is already booked!");
        return;
      }

      selectedDate = clicked;
      openModal('bookingModal');
    },

    eventClick(info){
      const e = info.event.extendedProps;
      selectedDoc = e.docId;

      vDate.innerText = info.event.startStr;
      vGuest.innerText = e.guestName;
      vNotes.innerText = e.notes || "No notes";

      openModal('viewModal');
    }
  });

  calendar.render();
  loadBookings();
}

/* LOAD BOOKINGS */
async function loadBookings(){
  const snap = await getDocs(collection(db,'blockedDates'));

  bookedDates = [];

  snap.forEach(d=>{
    const data = d.data();

    bookedDates.push(data.date);

    calendar.addEvent({
      title: data.guestName || 'Blocked',
      start: data.date,
      color: '#d9534f',
      allDay: true,
      extendedProps: {
        docId: d.id,
        guestName: data.guestName,
        notes: data.notes,
        ownerId: data.ownerId
      }
    });
  });

  applyBlockedStyles();
}

/* GREY OUT DATES */
function applyBlockedStyles(){
  setTimeout(() => {
    document.querySelectorAll('.fc-daygrid-day').forEach(cell => {
      const date = cell.getAttribute('data-date');

      if(bookedDates.includes(date)){
        cell.classList.add('blocked-date');
      }
    });
  }, 200);
}

/* SAVE BOOKING */
document.getElementById('saveBooking').onclick = async () => {

  let name = document.getElementById('guestName').value;
  let note = document.getElementById('notes').value;

  if(!name){
    alert("Enter guest name");
    return;
  }

  if(bookedDates.includes(selectedDate)){
    alert("❌ Already booked!");
    return;
  }

  await addDoc(collection(db,'blockedDates'),{
    date: selectedDate,
    guestName: name,
    notes: note || "",
    ownerId: auth.currentUser.uid
  });

  closeBooking();
  calendar.removeAllEvents();
  loadBookings();
};

/* UNBLOCK (ONLY OWNER) */
unblockBtn.onclick = async () => {

  const snap = await getDocs(collection(db,'blockedDates'));

  snap.forEach(async d=>{
    const data = d.data();

    if(d.id === selectedDoc){
      if(data.ownerId === auth.currentUser.uid){
        await deleteDoc(doc(db,'blockedDates', d.id));
      }else{
        alert("❌ You cannot delete this booking!");
      }
    }
  });

  closeView();
  calendar.removeAllEvents();
  loadBookings();
};

</script>

</body>
</html>
