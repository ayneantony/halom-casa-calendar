<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
content="
default-src 'self';
base-uri 'self';
object-src 'none';
form-action 'self';
upgrade-insecure-requests;
script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net;
style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
img-src 'self' data: blob: https:;
font-src 'self' data: blob: https:;
connect-src
https://firestore.googleapis.com
https://identitytoolkit.googleapis.com
https://securetoken.googleapis.com
https://firebaseinstallations.googleapis.com
https://www.googleapis.com
https://*.googleapis.com
wss://firestore.googleapis.com;
worker-src 'self' blob:;
manifest-src 'self';
">

<meta name="referrer"
content="strict-origin-when-cross-origin">
<meta http-equiv="X-XSS-Protection" content="0">

<meta http-equiv="Permissions-Policy"
content="
camera=(),
microphone=(),
geolocation=(),
payment=(),
usb=(),
accelerometer=(),
gyroscope=()
">
<title>Halom Casa Calendar</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h3>Halom Casa Calendar</h3>
<div style="display:flex; gap:10px;">
  <button id="copyReportBtn" style="width:auto;display:none">Copy Report</button>
  <button id="logoutBtn" style="width:auto;display:none">Logout</button>
</div>
</header>

<div id="loginBox">
<h2>Login</h2>
<input id="email" type="email" autocomplete="username" placeholder="Email">
<input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn">Login</button>
<div id="loginMsg"></div>
</div>

<div id="calendarContainer" style="display:none">
<div id="calendar"></div>
</div>

<div id="bookingModal" class="modal">
<div class="modal-content">
<h3>Create Booking</h3>
<input
id="guestName"
placeholder="Guest Name"
maxlength="50"
autocomplete="off">
<select id="bookingType">
<option value="Full Property">Full Property</option>
<option value="1 Room">1 Room</option>
<option value="2 Rooms">2 Rooms</option>
</select>
<button id="saveBooking">Save Booking</button>
<button id="cancelBooking">Cancel</button>
</div>
</div>

<div id="viewModal" class="modal">
<div class="modal-content">
<h3>Booking Details</h3>
<p><b>Date:</b> <span id="vDate"></span></p>
<p><b>Guest:</b> <span id="vGuest"></span></p>
<p><b>Type:</b> <span id="vType"></span></p>
<p><b>Booked By:</b> <span id="vBookedBy"></span></p>
<p><b>Booked On:</b> <span id="vBookedOn"></span></p>
<p><b>Availability:</b> <span id="vAvailability"></span></p>
<button id="unblockBtn">Delete Booking</button>
<button id="closeViewBtn">Close</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, deleteDoc, doc, onSnapshot, query, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLeIhKV7wHeeTtJhKuCSJuoJwfr8Lqn54",
  authDomain: "halom-casa-booking-calendar.firebaseapp.com",
  projectId: "halom-casa-booking-calendar",
  storageBucket: "halom-casa-booking-calendar.firebasestorage.app",
  messagingSenderId: "171254486073",
  appId: "1:171254486073:web:d1ea9a603c5b33d602a9e8"
};

const ADMIN_EMAIL = "ayneantony4159@gmail.com";
function getUserColor(email){
  if(email === ADMIN_EMAIL){
    return "#e74c3c";
  }
  const colors = ["#3498db", "#2ecc71", "#9b59b6", "#f39c12", "#1abc9c", "#e84393", "#34495e", "#16a085"];
  let hash = 0;
  for(let i = 0; i < email.length; i++){
    hash += email.charCodeAt(i);
  }
  return colors[Math.abs(hash) % colors.length];
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let calendar;
let selectedDate=null;
let selectedDoc=null;

function openModal(id){document.getElementById(id).style.display="flex";}
function closeModal(id){document.getElementById(id).style.display="none";}
document.getElementById("cancelBooking").onclick = () => closeModal("bookingModal");
document.getElementById("closeViewBtn").onclick = () => closeModal("viewModal");

loginBtn.onclick = async () => {
    loginMsg.textContent = "";
    loginBtn.disabled = true;
    try{
        await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
    }catch(error){
        switch(error.code){
            case "auth/invalid-credential": loginMsg.textContent="Invalid email or password."; break;
            case "auth/invalid-email": loginMsg.textContent="Invalid email address."; break;
            case "auth/too-many-requests": loginMsg.textContent="Too many attempts. Try again later."; break;
            default: loginMsg.textContent="Login failed.";
        }
    }finally{
        loginBtn.disabled=false;
    }
};

logoutBtn.onclick = async ()=>{
    await signOut(auth);
    location.reload();
};

onAuthStateChanged(auth,user=>{
 if(user){
  loginBox.style.display="none";
  calendarContainer.style.display="block";
  logoutBtn.style.display="block";
  document.getElementById("copyReportBtn").style.display="block";
  if(!calendar) initCalendar();
 }else{
  loginBox.style.display="block";
  calendarContainer.style.display="none";
  logoutBtn.style.display="none";
  document.getElementById("copyReportBtn").style.display="none";
 }
});

function roomsUsed(type){
 if(type==="Full Property") return 3;
 if(type==="2 Rooms") return 2;
 return 1;
}

function initCalendar(){
 calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
  initialView:'dayGridMonth',
  dateClick(info){
   if(!auth.currentUser) return;
   selectedDate=info.dateStr;
   openModal("bookingModal");
  },
  eventClick(info){
   const e=info.event.extendedProps;
   selectedDoc=e.docId;
   vDate.innerText=info.event.startStr;
   vGuest.innerText=e.guestName;
   vType.innerText=e.bookingType;
   vBookedBy.innerText=e.bookedBy||"-";
   vBookedOn.innerText=e.createdAt && e.createdAt.toDate ? e.createdAt.toDate().toLocaleString() : "-";
   vAvailability.innerText=e.availability || "";
   const user=auth.currentUser;
   unblockBtn.style.display=(user.email===ADMIN_EMAIL || user.uid===e.userId) ? "block":"none";
   openModal("viewModal");
  }
 });
 calendar.render();
 loadBookings();
}

function loadBookings(){
 onSnapshot(query(collection(db,"blockedDates")),snap=>{
  calendar.removeAllEvents();
  const dayTotals={};
  snap.forEach(d=>{
   const data=d.data();
   const used=roomsUsed(data.bookingType||"1 Room");
   dayTotals[data.date]=(dayTotals[data.date]||0)+used;
  });
  snap.forEach(d=>{
   const data=d.data();
   const remaining=Math.max(0,3-(dayTotals[data.date]||0));
   calendar.addEvent({
    title:`${String(data.bookingType)} - ${String(data.guestName)}`,
    start:data.date,
    allDay:true,
    color:getUserColor(data.bookedBy || ""),
    docId:d.id,
    guestName:data.guestName,
    bookingType:data.bookingType,
    bookedBy:data.bookedBy,
    userId:data.userId,
    createdAt:data.createdAt,
    availability: remaining===0 ? "Fully Booked" : remaining+" room(s) available"
   });
  });
 });
}

saveBooking.onclick = async () => {
    saveBooking.disabled = true;
    try {
        const user = auth.currentUser;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) {
            alert("Invalid date.");
            return;
        }
        const guest = guestName.value.trim();
        if(!/^[A-Za-z0-9 .'-]{2,50}$/.test(guest)){
            alert("Invalid guest name.");
            return;
        }
        const type = bookingType.value;
        const allowedTypes = ["Full Property", "1 Room", "2 Rooms"];
        if (!allowedTypes.includes(type)) {
            alert("Invalid booking type.");
            return;
        }

        const requested = roomsUsed(type);
        const countDocRef = doc(db, "roomCounts", selectedDate);
        const newBookingRef = doc(collection(db, "blockedDates"));

        await runTransaction(db, async (transaction) => {
            const countSnap = await transaction.get(countDocRef);
            let currentUsed = 0;
            if (countSnap.exists()) {
                currentUsed = countSnap.data().totalRooms || 0;
            }

            if (currentUsed + requested > 3) {
                throw new Error("Not enough rooms available.");
            }

            transaction.set(countDocRef, { totalRooms: currentUsed + requested }, { merge: true });
            transaction.set(newBookingRef, {
                date: selectedDate,
                guestName: guest,
                bookingType: type,
                bookedBy: user.email,
                userId: user.uid,
                createdAt: serverTimestamp()
            });
        });

        guestName.value = "";
        closeModal("bookingModal");
    } catch (error) {
        alert(error.message || "Unable to save booking.");
        console.error(error);
    } finally {
        saveBooking.disabled = false;
    }
};

unblockBtn.onclick = async () => {
    unblockBtn.disabled = true;
    try {
        const events = calendar.getEvents().filter(e => e.extendedProps.docId === selectedDoc);
        if (events.length === 0) return;
        
        const targetEvent = events[0];
        const targetDate = targetEvent.startStr;
        const targetType = targetEvent.extendedProps.bookingType;
        const roomsToFree = roomsUsed(targetType);

        const countDocRef = doc(db, "roomCounts", targetDate);
        const bookingDocRef = doc(db, "blockedDates", selectedDoc);

        await runTransaction(db, async (transaction) => {
            const countSnap = await transaction.get(countDocRef);
            let currentUsed = 0;
            if (countSnap.exists()) {
                currentUsed = countSnap.data().totalRooms || 0;
            }

            let newTotal = Math.max(0, currentUsed - roomsToFree);
            transaction.set(countDocRef, { totalRooms: newTotal }, { merge: true });
            transaction.delete(bookingDocRef);
        });

        closeModal("viewModal");
    } catch (error) {
        alert("Could not cancel booking safely.");
        console.error(error);
    } finally {
        unblockBtn.disabled = false;
    }
};

document.getElementById("copyReportBtn").onclick = async () => {
  try {
    const currentViewDate = calendar.getDate(); 
    const targetYear = currentViewDate.getFullYear();
    // Convert 0-indexed month integer to 2-digit padded string layout matching standard HTML values ("01", "07", etc.)
    const targetMonthStr = String(currentViewDate.getMonth() + 1).padStart(2, '0');

    const monthYearStr = currentViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    // Explicit string splitting filter prevents overlapping calculations with bounding grid rows
    const events = calendar.getEvents()
      .filter(e => {
        const [year, month] = e.startStr.split('-');
        return year === String(targetYear) && month === targetMonthStr;
      })
      .sort((a, b) => a.startStr.localeCompare(b.startStr));

    const bookingLines = events.map(e => {
      const [year, month, day] = e.startStr.split('-');
      const formattedDate = `${day}/${month}/${year}`;
      const type = e.extendedProps.bookingType || "1 Room";
      const guest = e.extendedProps.guestName || "Guest";
      return `${formattedDate} - ${type} - ${guest}`;
    });

    const nowStr = new Date().toLocaleString('en-GB', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    }).replace(',', '');

    const reportText = [
      `Halom Casa Bookings - ${monthYearStr}\n`,
      bookingLines.length > 0 ? bookingLines.join('\n') : "No bookings found for this month.",
      `\nTotal Bookings: ${events.length}`,
      `\nGenerated on: ${nowStr}`
    ].join('\n');

    await navigator.clipboard.writeText(reportText);
    alert("Report copied to clipboard successfully!");
  } catch (err) {
    console.error("Failed to copy report: ", err);
    alert("Could not copy report to clipboard.");
  }
};
</script>
</body>
</html>
