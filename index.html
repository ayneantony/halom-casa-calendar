<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halom Casa - Booking Calendar</title>
  
  <!-- Modern Content Security Policy without frame-ancestors and allowing gstatic for source maps -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    script-src 'self' 'unsafe-inline' https://www.gstatic.com; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src 'self' https://fonts.gstatic.com; 
    img-src 'self' data: https:; 
    connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://www.googleapis.com wss://firestore.googleapis.com https://www.gstatic.com; 
    object-src 'none'; 
    base-uri 'self'; 
    form-action 'self';
  ">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="logo-container">
      <h1>Halom Casa</h1>
      <span class="subtitle">Booking & Availability Calendar</span>
    </div>
    <div id="authContainer" class="auth-container">
      <div id="userProfile" class="user-profile hidden">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
      <button id="googleLoginBtn" class="btn btn-primary">Sign in with Google</button>
    </div>
  </header>

  <main class="main-content">
    
    <!-- Property Selector Tabs -->
    <div class="property-tabs">
      <button class="tab-btn active" data-property="vagamon">Vagamon Property</button>
      <button class="tab-btn" data-property="mulavukad">Mulavukad Property</button>
    </div>

    <!-- Main Content Grid -->
    <div class="dashboard-grid">
      
      <!-- Calendar View Container -->
      <section class="card calendar-card">
        <div class="calendar-header">
          <button id="prevMonthBtn" class="btn-icon">&lt;</button>
          <h2 id="currentMonthYear"></h2>
          <button id="nextMonthBtn" class="btn-icon">&gt;</button>
        </div>
        
        <div class="calendar-weekdays">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

        <div class="calendar-legend">
          <span class="legend-item"><span class="color-box available"></span> Available</span>
          <span class="legend-item"><span class="color-box partial"></span> Partially Booked</span>
          <span class="legend-item"><span class="color-box booked"></span> Fully Booked</span>
        </div>
      </section>

      <!-- Booking Form & Manager Side Panel -->
      <section class="card form-card">
        <h3>Reserve or Block Dates</h3>
        <form id="bookingForm">
          
          <div class="form-group">
            <label for="selectedDate">Selected Date</label>
            <input type="date" id="selectedDate" required readonly>
          </div>

          <div class="form-group">
            <label for="guestName">Guest / Booking Name</label>
            <input type="text" id="guestName" placeholder="Enter guest name" required minlength="2" maxlength="50">
          </div>

          <div class="form-group">
            <label for="bookingType">Booking Type</label>
            <select id="bookingType" required>
              <option value="1 Room">1 Room</option>
              <option value="2 Rooms">2 Rooms</option>
              <option value="Full Property">Full Property (3 Rooms)</option>
            </select>
          </div>

          <button type="submit" id="submitBookingBtn" class="btn btn-action" disabled>
            Login to Add Booking
          </button>
        </form>

        <div id="statusMessage" class="status-message hidden"></div>

        <!-- Bookings List for Selected Date -->
        <div class="existing-bookings-container">
          <h4>Bookings on Selected Date</h4>
          <ul id="existingBookingsList" class="bookings-list">
            <li class="empty-state">Select a date on the calendar to view details.</li>
          </ul>
        </div>
      </section>

    </div>
  </main>

  <!-- Application Logic (Module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
